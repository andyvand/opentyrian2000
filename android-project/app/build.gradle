plugins {
     id 'com.android.application'
}

def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE');

android {
    namespace "org.libsdl.opentyrian"
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-31"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64', 'riscv64'
            }
            // cmake {
                // arguments "-DANDROID_PLATFORM=android-19", "-DANDROID_STL=c++_static"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                // abiFilters 'arm64-v8a'
            //}
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //if (buildWithCMake) {
            //    cmake {
            //        path 'jni/CMakeLists.txt'
            //    }
            //} else {
                ndkBuild {
                    path 'jni/Android.mk'
            //    }
            }
        }

    }

    // Bundle Tyrian data files into the APK so they can be copied to the
    // app's internal storage on first launch. Staged under a "data/"
    // subdirectory so the Java loader can enumerate them as a group.
    sourceSets.main {
        assets.srcDirs += file("${buildDir}/generated/tyrianAssets").absolutePath
    }
    androidResources {
        noCompress 'dat', 'shp', 'mus', 'snd', 'lvl', 'pic', 'cdt', 'cd1', 'cd2', 'cd3', 'cd4', 'cd5', 'sd2', '1', '2', '3', '4', '5'
    }
    lint {
        abortOnError false
    }
}

// Stage the repo's top-level data/ directory into an APK assets subdir
// (assets/data/...). Done via a Copy task so the build remains portable
// (no filesystem symlinks required).
tasks.register('stageTyrianData', Copy) {
    description = "Stage Tyrian data files into assets/data/ for the APK."
    from rootProject.file('../data')
    into "${buildDir}/generated/tyrianAssets/data"
}

afterEvaluate {
    tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }
        .configureEach { dependsOn stageTyrianData }
    tasks.matching { it.name.startsWith('generate') && it.name.endsWith('Assets') }
        .configureEach { dependsOn stageTyrianData }
    tasks.matching { it.name.toLowerCase().contains('lint') }
        .configureEach { dependsOn stageTyrianData }
    tasks.matching { it.name.startsWith('package') && it.name.endsWith('Assets') }
        .configureEach { dependsOn stageTyrianData }
    tasks.matching { it.name.startsWith('compress') && it.name.endsWith('Assets') }
        .configureEach { dependsOn stageTyrianData }
    tasks.matching { it.name.startsWith('extractDeepLinks') }
        .configureEach { dependsOn stageTyrianData }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
